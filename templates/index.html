<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>AskAI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Söhne:wght@400;500;600&family=Söhne+Mono&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
  <aside class="sidebar">
    <div class="sidebar-header">
      <div class="sidebar-title">AskAi</div>
      <button class="btn-new" id="newChat">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M12 5v14M5 12h14"/>
        </svg>
        New chat
      </button>
    </div>
    <div class="sidebar-footer">
      <div class="model-badge">
        <div class="model-dot"></div>
        LLaMA 3.3 · 70B
      </div>
    </div>
  </aside>

  <main class="main">
    <div class="chat-container" id="chatContainer">
      <div class="welcome" id="welcome">
        <div class="welcome-logo">
          <div class="logo-circle">A</div>
        </div>
        <h1>How can I help you today?</h1>
        <div class="suggestions">
          <button class="suggestion" data-text="Explain quantum computing in simple terms">
            <span class="suggestion-icon">⚛</span>
            <span>Explain quantum computing</span>
          </button>
          <button class="suggestion" data-text="Write a Python function to reverse a string">
            <span class="suggestion-icon">💻</span>
            <span>Write Python code</span>
          </button>
          <button class="suggestion" data-text="What are 3 tips for better productivity?">
            <span class="suggestion-icon">✅</span>
            <span>Productivity tips</span>
          </button>
          <button class="suggestion" data-text="Summarize the history of the internet">
            <span class="suggestion-icon">🌐</span>
            <span>History of the internet</span>
          </button>
        </div>
      </div>
      <div class="messages" id="messages"></div>
    </div>

    <div class="input-area">
      <div class="input-wrapper">
        <textarea
          id="userInput"
          placeholder="Message AskAI"
          rows="1"
          autocomplete="off"
        ></textarea>
        <button class="send-btn" id="sendBtn" disabled>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
            <path d="M12 4l8 16-8-4-8 4 8-16z"/>
          </svg>
        </button>
      </div>
      <p class="input-hint">AskAI can make mistakes. Consider checking important information.</p>
    </div>
  </main>

  <script src="/static/js/main.js"></script>
</body>
</html>
